AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Provides APIs for summarizing content and viewing cache, using DynamoDB for storage and Bedrock for AI.

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Deployment stage (e.g., dev, prod)
  OpenRouterApiKey:
    Type: String
    Description: API Key for OpenRouter
  SkipCacheMagicWord:
    Type: String
    Description: Magic word to skip cache lookup
  OpenRouterAppName:
    Type: String
    Description: App name for OpenRouter identification
  OpenRouterAppUrl:
    Type: String
    Description: App URL for OpenRouter identification

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 60
    Tracing: Active 
    Layers:
      - arn:aws:lambda:us-east-1:901920570463:layer:aws-otel-python-amd64-ver-1-29-0:1
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: path-summarize-alerts
        POWERTOOLS_METRICS_NAMESPACE: path-summarize-alerts
        LOG_LEVEL: DEBUG
        OPENROUTER_API_KEY: !Ref OpenRouterApiKey
        SKIP_CACHE_MAGIC_WORD: !Ref SkipCacheMagicWord
        OPENROUTER_APP_NAME: !Ref OpenRouterAppName
        OPENROUTER_APP_URL: !Ref OpenRouterAppUrl
        AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-instrument
        BAML_LOG: trace
        DYNAMODB_TABLE: !Ref AiResponsesTables
    CodeUri: src/
    Architectures:
      - x86_64 # Ensure this matches the layer architecture

Resources:
  # --- API Gateway (REST API - V1) ---
  # Note: The resource name "HttpApi" is just a logical ID in the template,
  # the Type: AWS::Serverless::Api is what determines it's a REST API (V1).
  # If you intended HTTP API (V2), the Type should be AWS::Serverless::HttpApi
  # and CorsConfiguration would be valid there. Based on the original serverless.yml
  # http events, REST API (V1) is the typical default.
  ApiGateway: # Renamed for clarity to avoid confusion with HTTP API V2
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      MinimumCompressionSize: 0
      # CORS is configured on the individual function events for REST APIs in SAM
      # CorsConfiguration property is ONLY for AWS::Serverless::HttpApi (V2)


  # --- Lambda Functions ---
  SummarizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub path-summarize-alerts-${Stage}-summarize
      Handler: handlers.summarize.handle
      Events:
        SummarizeApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /summarize
            Method: get
      Environment:
        Variables:
          MULTISUMMARIZER_LAMBDA_NAME: !Ref MultisummarizeFunction
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: "*"
        - Statement:
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: "arn:aws:bedrock:*:*:*/*"
    Connectors:
      DynamoDBConnector:
        Properties:
          Destination:
            Id: AiResponsesTables
          Permissions:
            - Read
            - Write
      MultiSummarizeConnector:
        Properties:
          Destination:
            Id: MultisummarizeFunction
          Permissions:
            - Write

  MultisummarizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub path-summarize-alerts-${Stage}-multisummarize
      Handler: handlers.multisummarize.handle
      Timeout: 600
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: "*"
        - Statement:
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: "arn:aws:bedrock:*:*:*/*"
    Connectors:
      DynamoDBConnector:
        Properties:
          Destination:
            Id: AiResponsesTables
          Permissions:
            - Read
            - Write

  ViewCacheFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub path-summarize-alerts-${Stage}-viewcache
      Handler: handlers.view_cache.handle
      Events:
        ViewCacheApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /viewcache
            Method: get
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: "*"
    Connectors:
      DynamoDBConnector:
        Properties:
          Destination:
            Id: AiResponsesTables
          Permissions:
            - Read
            - Write

  AiResponsesTables:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AiResponseTable
      AttributeDefinitions:
        - AttributeName: input_string_hash
          AttributeType: S    # S for String
        - AttributeName: code_version_hash
          AttributeType: S    # S for String
      KeySchema:
        - AttributeName: input_string_hash
          KeyType: HASH     # Partition Key
      GlobalSecondaryIndexes:
        - IndexName: CodeVersionIndex
          KeySchema:
            - AttributeName: code_version_hash
              KeyType: HASH
          Projection:
            ProjectionType: ALL # This means all attributes from the main table are projected into the index.
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: StageName
          Value: !Ref Stage

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL for Dev stage"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/"
  AiResponsesTablesName:
    Description: The name of the DynamoDB table for AI responses
    Value: !Ref AiResponsesTables
    Export:
      Name: AiResponsesTablesName