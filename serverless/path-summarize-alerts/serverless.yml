org: amandeepg
app: path-summarize-alerts
service: path-summarize-alerts

provider:
  name: aws
  stage: dev
  runtime: python3.12
  memorySize: 256
  timeout: 30
  logRetentionInDays: 14
  tracing:
    lambda: true
  apiGateway:
    minimumCompressionSize: 0

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:ListObject
            - s3:ListBucket
            - s3:GetObject
            - s3:PutObject
          Resource:
            - arn:aws:s3:::path-summarize-data
            - arn:aws:s3:::path-summarize-data/*
            - arn:aws:s3:::path-summarize-data/*/*
            - arn:aws:s3:::path-summarize-data/*/*/*
            - arn:aws:s3:::path-summarize-data-rate-limit
            - arn:aws:s3:::path-summarize-data-rate-limit/*
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: "*"
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
          Resource: "arn:aws:bedrock:*:*:*/*"
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource: arn:aws:lambda:us-east-1:459074224363:function:${self:service}-${self:provider.stage}-multisummarize

  environment:
    POWERTOOLS_SERVICE_NAME: ${self:service}
    POWERTOOLS_METRICS_NAMESPACE: ${self:service}
    LOG_LEVEL: INFO
    OPENROUTER_API_KEY: ${file(./config.yml):OPENROUTER_API_KEY}
    SKIP_CACHE_MAGIC_WORD: ${file(./config.yml):SKIP_CACHE_MAGIC_WORD}
    OPENROUTER_APP_NAME: ${file(./config.yml):OPENROUTER_APP_NAME}
    OPENROUTER_APP_URL: ${file(./config.yml):OPENROUTER_APP_URL}
    BOUNDARY_PROJECT_ID: ${file(./config.yml):BOUNDARY_PROJECT_ID}
    BOUNDARY_SECRET: ${file(./config.yml):BOUNDARY_SECRET}
    GOOGLE_API_KEY: ${file(./config.yml):GOOGLE_API_KEY}
    MULTISUMMARIZER_LAMBDA_NAME: ${self:service}-${self:provider.stage}-multisummarize
    AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-instrument
    BAML_LOG: info

functions:
  summarize:
    handler: src.handlers.summarize.handle
    timeout: 29
    events:
      - http:
          path: /summarize
          method: get
          cors: true
    layers:
      - arn:aws:lambda:us-east-1:901920570463:layer:aws-otel-python-amd64-ver-1-29-0:1
  multisummarize:
    handler: src.handlers.multisummarize.handle
    timeout: 500
    layers:
      - arn:aws:lambda:us-east-1:901920570463:layer:aws-otel-python-amd64-ver-1-29-0:1
  viewcache:
    handler: src.handlers.view_cache.handle
    timeout: 29
    events:
      - http:
          path: /viewcache
          method: get
          cors: true
    layers:
      - arn:aws:lambda:us-east-1:901920570463:layer:aws-otel-python-amd64-ver-1-29-0:1

package:
  patterns:
    - '!.venv/**'
    - '!node_modules/**'
    - '!tests/**'
    - '!.git/**'
    - '!.pytest_cache/**'
    - '!__pycache__/**'
    - '!.coverage'
    - '!.gitlab-ci.yml'
    - '!README.md'
    - '!config.yml'
    - '!.idea'
    - '!.idea/**'
    - '!src/__pycache__/**'
    - '!.clinerules-code'
    - '!.*-version'
    - '!*.sh'
    - '!*.uv.lock'
    - '!*.ruff-cache'

plugins:
  - serverless-python-requirements
  - serverless-iam-roles-per-function
  - serverless-offline

resources:
  Resources:
    SummarizeDataBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: path-summarize-data
        LifecycleConfiguration:
          Rules:
            - Id: ExpireOldData
              Status: Enabled
              ExpirationInDays: 30
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
    SummarizeDataRateLimit:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: path-summarize-data-rate-limit
        LifecycleConfiguration:
          Rules:
            - Id: ExpireOldData
              Status: Enabled
              ExpirationInDays: 1
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
