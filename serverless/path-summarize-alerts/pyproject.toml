[project]
name = "path-summarize-alerts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools[parser]==3.11.0",
    "baml-py==0.86.1",
    "boto3==1.38.6",
    "boto3-stubs[essential]==1.38.6",
    "botocore==1.38.6",
    "jinja2==3.1.6",
    "opentelemetry-api==1.32.1",
    "opentelemetry-sdk==1.32.1",
    "pydantic==2.11.4",
    "tomli==2.2.1",
    "types-jinja2==2.11.9",
]

[dependency-groups]
dev = [
    "deptry==0.23.0",
    "path-summarize-alerts",
    "pip==25.1",
]

[tool.ruff]
# In addition to the standard set of exclusions, omit all tests, plus a specific file.
extend-exclude = [".aws-sam"]

[tool.pyright]
include = ["src"]
strict = ["src/lib", "src/handlers", "src/*.py"]
ignore = ["src/baml_client"]
venv = ".venv"
venvPath = "."
