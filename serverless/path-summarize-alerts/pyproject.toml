[project]
name = "path-summarize-alerts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.8"
dependencies = [
    "aws-lambda-powertools[parser]>=3.19.0",
    "baml-py==0.86.1",
    "dyntastic>=0.18.0",
    "jinja2>=3.1.6",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "pydantic>=2.11.7",
    "dspy>=3.0.3",
]

[dependency-groups]
dev = [
    "boto3>=1.40.11",
    "botocore>=1.40.11",
    "deptry>=0.23.1",
    "pip>=25.2",
    "pyright>=1.1.404",
    "tqdm>=4.67.1",
    "wandb>=0.21.3",
    "boto3-stubs[essential]>=1.40.11",
    "tomli>=2.2.1",
    "types-jinja2>=2.11.9",
]

[tool.ruff]
# In addition to the standard set of exclusions, omit all tests, plus a specific file.
extend-exclude = [".aws-sam"]

[tool.pyright]
include = ["src"]
strict = ["src/lib", "src/handlers", "src/*.py"]
ignore = ["src/baml_client"]
venv = ".venv"
venvPath = "."

[tool.uv.sources]
dspy = { git = "https://github.com/stanfordnlp/dspy.git" }
