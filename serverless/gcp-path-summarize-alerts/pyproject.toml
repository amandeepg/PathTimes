[project]
name = "gcp-path-summarize-alerts"
version = "0.1.0"
description = "HTTP Cloud Function: summarize text with Gemini and cache in Firestore."
requires-python = ">=3.11"
dependencies = [
  "functions-framework==3.5.0",
  "google-cloud-firestore==2.21.0",
  "google-cloud-aiplatform==1.128.0",
  "google-cloud-tasks==2.20.0",
  "pydantic==2.8.2",
  "openai>=1.55.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "basedpyright>=1.34.0",
    "ruff>=0.14.6",
]
