//file:noinspection DependencyNotationArgument
//file:noinspection ConfigurationAvoidance
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'app.cash.licensee'
    id 'app.cash.paparazzi'
    id 'com.android.application'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jmailen.kotlinter'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.firebase-perf'
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "ca.amandeep.path"
        minSdk 29
        targetSdk 36
        versionCode 4
        versionName "1.3"

        vectorDrawables {
            useSupportLibrary true
        }
        signingConfig signingConfigs.debug
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(project.rootProject.file(".java-version").getText().trim()))
            vendor.set(JvmVendorSpec.ADOPTIUM)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += "-opt-in=kotlin.RequiresOptIn"
        freeCompilerArgs += "-P"
        //noinspection GrDeprecatedAPIUsage
        freeCompilerArgs += "plugin:androidx.compose.compiler.plugins.kotlin:metricsDestination=" + project.buildDir.absolutePath + "/compose_compiler"
        freeCompilerArgs += "-P"
        //noinspection GrDeprecatedAPIUsage
        freeCompilerArgs += "plugin:androidx.compose.compiler.plugins.kotlin:reportsDestination=" + project.buildDir.absolutePath + "/compose_compiler"
    }

    buildFeatures {
        compose true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    namespace 'ca.amandeep.path'

    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            def unitTestTaskName = "test${variant.name.capitalize()}UnitTest"
            def unitTestTask = tasks.findByName(unitTestTaskName)
            if (unitTestTask != null) {
                unitTestTask.enabled = false
                println "Disabled unit tests for release variant: ${variant.name} ($unitTestTaskName)"
            }
        }
    }
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(project.rootProject.file(".java-version").getText().trim()))
        vendor.set(JvmVendorSpec.ADOPTIUM)
    }
}

java {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

tasks.withType(KotlinCompile) {
    //noinspection GrDeprecatedAPIUsage
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation(project(":data"))
    implementation(project(":main-core"))
    implementation(project(":strings"))
    implementation(project(":ui-alerts"))
    implementation(project(":ui-core"))
    implementation(project(":ui-stations"))
    implementation(project(":util"))
    implementation(project(":prefs"))

    implementation AndroidX.activity.compose
    implementation AndroidX.compose.material
    implementation AndroidX.compose.material.icons.extended
    implementation AndroidX.compose.material3
    implementation AndroidX.compose.material3.windowSizeClass
    implementation AndroidX.compose.ui
    implementation AndroidX.core.ktx
    implementation AndroidX.core.splashscreen
    implementation AndroidX.lifecycle.runtime.compose
    implementation AndroidX.lifecycle.runtime.ktx
    implementation AndroidX.lifecycle.viewModelKtx
    implementation AndroidX.navigation.compose
    implementation KotlinX.collections.immutable

    implementation AndroidX.dataStore.preferences

    implementation 'com.github.ajalt:timberkt:_'
    implementation JakeWharton.timber

    implementation platform(Firebase.bom)
    implementation Firebase.crashlytics
    implementation Firebase.analytics
    implementation Firebase.performanceMonitoring

    implementation AndroidX.compose.ui.tooling
    debugImplementation AndroidX.compose.ui.toolingPreview

    testImplementation(Testing.junit4)
    testImplementation "com.google.truth:truth:_"
    testImplementation "com.google.truth.extensions:truth-java8-extension:_"
}

licensee {
    allow 'Apache-2.0'
    allow 'BSD-3-Clause'
    allowUrl('https://developer.android.com/studio/terms.html') {
        because 'Android Software Development Kit License Agreement'
    }
    allow 'MIT'
    allowUrl('https://jsoup.org/license') {
        because 'MIT, but self-hosted copy of the license'
    }
}

tasks.withType(Test) {
    android.sourceSets.main.res.srcDirs += 'src/test/res'
    maxParallelForks = 4
}

