import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'com.android.library'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.android'
    id 'org.jmailen.kotlinter'
}

android {
    namespace 'ca.amandeep.path.data'
    compileSdk 35

    defaultConfig {
        minSdk 29

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(project.rootProject.file(".java-version").getText().trim()))
            vendor.set(JvmVendorSpec.ADOPTIUM)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += "-opt-in=kotlin.RequiresOptIn"
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(project.rootProject.file(".java-version").getText().trim()))
        vendor.set(JvmVendorSpec.ADOPTIUM)
    }
}

java {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

tasks.withType(KotlinCompile) {
    //noinspection GrDeprecatedAPIUsage
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation(project(":util"))
    api(project(":json"))

    implementation AndroidX.work.runtimeKtx
    implementation KotlinX.collections.immutable

    //noinspection GradleDependency breaking permissions changes, TODO handle them
    implementation Google.accompanist.permissions
    implementation Google.android.playServices.location

    implementation Square.moshi.adapters
    implementation Square.moshi
    implementation Square.retrofit2.converter.moshi
    implementation Square.retrofit2.converter.scalars
    implementation Square.retrofit2

    implementation "org.jsoup:jsoup:_"

    implementation 'com.github.ajalt:timberkt:_'
    implementation JakeWharton.timber

    implementation AndroidX.compose.ui.tooling
    debugImplementation AndroidX.compose.ui.toolingPreview

    testImplementation(Testing.junit4)
    testImplementation "com.google.truth:truth:_"
    testImplementation "com.google.truth.extensions:truth-java8-extension:_"
}
